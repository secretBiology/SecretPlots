name: CI

on:
  push:
    branches: [master, v3]
  pull_request:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --group docs --group dev
      - run: uv pip install -r docs/requirements.txt
      - run: .venv/bin/python scripts/render_docs.py
      - run: .venv/bin/python -m pytest tests/test_docs.py
      - run: .venv/bin/mkdocs build --strict

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --group dev
      - run: uv run pytest --mpl --cov --cov-report=xml

  minimum-dependencies:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv venv .venv-min --python 3.12
      - run: >-
          uv pip install --python .venv-min/bin/python -e .
          "numpy==2.0.0" "pandas==2.2.2" "matplotlib==3.9.0"
          "SecretColors==2.0.0" "pytest>=8.3" "pytest-mpl>=0.17" "scipy>=1.14"
          "lifelines>=0.30.0"
      # Pixel baselines use the locked renderer; minimum versions check behavior
      # and the PNG/PDF/SVG export smoke tests without comparing raster pixels.
      - run: .venv-min/bin/python -m pytest
