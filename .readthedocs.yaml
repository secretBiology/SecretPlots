# https://docs.readthedocs.com/platform/stable/intro/mkdocs.html
version: 2
build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    pre_build:
      - python scripts/render_docs.py
python:
  install:
    - requirements: docs/requirements.txt
    - method: pip
      path: .
mkdocs:
  configuration: mkdocs.yml
  fail_on_warning: true
