name = "science"
kind = "journal"
official = true
description = "Science (AAAS)."
source_url = "https://www.science.org/cms/asset/62583409-a188-466e-8cc0-6fb5f083bbff/author_prep_guide_2025.pdf"
verified_on = "2026-10-21"

# "Guide to Preparing Figures" (2025): 1 column = 9 cm, 2 column = 18.3 cm;
# sans serif, preferably Arial or Helvetica; labels 6 to 9 pt, at most 3 sizes;
# panel parts 10 pt bold capitals; minimum line weight 0.28 pt; 300 ppi raster.
[target]
widths = { single = "9cm", double = "18.3cm" }
default_width = "single"
min_font_size = 6
max_font_size = 9
min_line_width = 0.28
font_generic = "sans-serif"
dpi = 300
formats = ["pdf", "eps", "svg", "tiff", "png"]

# Three sizes: 7 pt ticks/legend, 8 pt axis titles, 9 pt titles; 6 pt notes.
[theme]
font_family = ["Arial", "Helvetica", "Liberation Sans"]
font_generic = "sans-serif"
font_size = 7
label_scale = 1.1428
title_scale = 1.2857
subtitle_scale = 1.1428
note_scale = 0.8572

[chrome]
panel_label_case = "upper"
panel_label_weight = "bold"
panel_label_size = 10
