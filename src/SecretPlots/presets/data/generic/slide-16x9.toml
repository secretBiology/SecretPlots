name = "slide-16x9"
kind = "generic"
description = "16:9 presentation slides (13.33 x 7.5 in)."

[target]
widths = { full = "12in", half = "5.8in" }
default_width = "full"
aspect = 0.5
max_height = "6.2in"
min_font_size = 14
min_line_width = 1.5
dpi = 200
formats = ["png", "svg", "pdf"]

# Text is raised to 14 pt (about 1.6x the 9 pt base); marks grow with it so
# lines and points keep their weight relative to the text.
[theme]
line_width = 2.5
axis_line_width = 1.5
grid_width = 1.5
tick_length = 5.0
marker_size = 8.0
marker_edge_width = 0.8
errorbar_capsize = 4.0
