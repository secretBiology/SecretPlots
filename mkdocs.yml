site_name: SecretPlots
site_description: Publication-ready scientific figures in a few readable lines of Python, with presets for Nature, Science, Cell, IEEE and more.
site_url: https://secretplots.readthedocs.io/
repo_url: https://github.com/secretBiology/SecretPlots
repo_name: secretBiology/SecretPlots
edit_uri: edit/master/docs/
copyright: MIT licensed · Every figure on this site is generated from the code shown next to it.
theme:
  name: material
  custom_dir: docs_overrides
  font: false
  icon:
    logo: material/chart-bell-curve-cumulative
    repo: fontawesome/brands/github
    admonition:
      example: material/code-braces
  favicon: assets/favicon.svg
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
extra_css:
  - stylesheets/extra.css
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
nav:
  - Home: index.md
  - Get started:
      - Your first figure: quickstart.md
      - Find any option: options.md
  - Gallery: gallery.md
  - Plot guides:
      - Bar: plots/bar.md
      - Scatter: plots/scatter.md
      - Line: plots/line.md
      - Area and fill between: plots/area.md
      - Histogram: plots/histogram.md
      - Heatmap: plots/heatmap.md
      - Forest: plots/forest.md
      - Survival: plots/survival.md
      - Box: plots/box.md
      - Violin and raincloud: plots/violin.md
  - Publishing:
      - Journal-ready figures: publication.md
      - Presets and themes: presets.md
      - Data, formatting and export: usage.md
  - API reference: api.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_signature_annotations: true
            docstring_style: google
