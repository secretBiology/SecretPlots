[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "SecretPlots"
dynamic = ["version"]
description = "Easy, publication-ready plots with journal and newsroom presets."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rohit Suratekar", email = "rohitsuratekar@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "SecretColors>=2.0",
]
keywords = ["plotting", "matplotlib", "visualization", "publication", "figures"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Visualization",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/secretBiology/SecretPlots"
Issues = "https://github.com/secretBiology/SecretPlots/issues"
Changelog = "https://github.com/secretBiology/SecretPlots/blob/master/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-mpl>=0.17",
    "ruff>=0.8",
    "mypy>=1.13",
    "pandas-stubs>=2.2",
    "pre-commit>=4.0",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
]

[tool.hatch.version]
path = "src/SecretPlots/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/SecretPlots"]

[tool.hatch.build.targets.sdist]
include = ["src/SecretPlots", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "N", "SIM", "RUF", "PT", "NPY", "PTH"]
# The package keeps its CamelCase name to match SecretColors, and the documented
# idiom is `import SecretPlots as sp`.
ignore = ["N813"]

[tool.ruff.lint.per-file-ignores]
"src/SecretPlots/**" = ["N999"]
"tests/**" = ["N999", "E501"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src/SecretPlots"]

[[tool.mypy.overrides]]
module = ["SecretColors", "SecretColors.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# SecretPlots warnings are turned into errors in tests/conftest.py (a filter here
# would import the package before coverage starts).
addopts = ["-ra", "--strict-markers", "--mpl-baseline-path=tests/baseline"]

[tool.coverage.run]
source = ["SecretPlots"]
branch = true
