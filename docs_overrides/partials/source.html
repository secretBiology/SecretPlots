{# Keep the repository link without requesting GitHub release/star metadata.
   This also works offline and for repositories without a published release. #}
<a href="{{ config.repo_url }}" title="View source on GitHub" class="md-source">
  <div class="md-source__icon md-icon">
    {% include ".icons/fontawesome/brands/git-alt.svg" %}
  </div>
  <div class="md-source__repository">{{ config.repo_name }}</div>
</a>
